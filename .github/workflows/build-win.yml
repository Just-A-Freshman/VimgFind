name: Windows 构建打包测试

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ttkbootstrap==1.19.0 tkinterdnd2==0.4.3 pathspec psutil pywin32
          pip install pyinstaller

      - name: 步骤1 — PyInstaller 打包
        run: |
          Copy-Item build_exe/main.spec main.spec
          pyinstaller main.spec --noconfirm --clean

      - name: 步骤2 — 裁剪 dist
        run: python build_exe/build_trim.py dist/main
        env:
          PYTHONIOENCODING: utf-8

      - name: 步骤3 — 移动 config 到 _internal
        run: |
          if (-not (Test-Path "dist/main/_internal/config")) { New-Item -ItemType Directory -Path "dist/main/_internal/config" -Force | Out-Null }
          Copy-Item -Recurse -Force "build_exe/config/*" "dist/main/_internal/config/"

      - name: 步骤4 — 验证构建产物
        run: |
          if (-not (Test-Path "dist/main/main.exe")) { throw "main.exe 未生成" }
          Write-Host "OK main.exe 已生成"
          Get-ChildItem "dist/main/_internal/config/data"
          Write-Host "OK config 已移动到 _internal/"

      - name: 步骤5 — 启动测试
        run: |
          $proc = Start-Process -FilePath "dist/main/main.exe" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 15
          $p = Get-Process -Name "main" -ErrorAction SilentlyContinue
          if (-not $p) {
            Write-Host "FAIL 应用启动失败"
            exit 1
          }
          Write-Host "OK 应用启动成功, PID: $($p.Id)"
          Stop-Process -Name "main" -Force
          Write-Host "OK 应用已关闭"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: VimgFind-win64
          path: dist/main/